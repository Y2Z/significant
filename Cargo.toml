[package]
name = "significant"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Sign and verify media files in place, with no sidecar files, using C2PA"
readme = "README.md"
license = "0BSD"

[lib]
path = "src/lib.rs"

[[bin]]
name = "significant"
path = "src/main.rs"

[dependencies]
anyhow = "1"
c2pa = { version = "0.91", features = ["file_io"] }
clap = { version = "4", features = ["derive"] }
pem = "3"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rcgen = "0.13"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = "0.3"
